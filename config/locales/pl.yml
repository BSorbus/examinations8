    testportal:
      title: "Przystąp do Egzaminu"
      title_grades: "Testy"
      info_html: >-
        <p>Uwaga!</p>
        <p>Cały egzamin składa się z 4 testów (przedmiotów), po 8 pytań z każdego przedmiotu, czyli łącznie z 32 pytania testowe.
        Do każdego pytania wybierz tylko jedną odpowiedź.</p>
        <p>Na udzielenie 8 odpowiedzi z każdego przedmiotu masz 8 minut. Możesz przechodzić między pytaniami w dowolnej kolejności, nie musisz odpowiadać od razu - możesz pominąć trudniejsze i wrócić do nich później, system zapamiętuje Twoje zaznaczone odpowiedzi.</p>
        <p>Możesz robić przerwy pomiędzy przedmiotami, ale cały egzamin musisz odbyć w trakcie czasu przeznaczonego na daną sesję.
        Możesz zdawać przedmioty w dowolnej kolejności.</p>
        <p>Rozwiązuj testy bez niedozwolonych pomocy, bo może to skutkować niezaliczeniem testu ! System posiada zabezpieczenia, uniemożliwiające udzielanie odpowiedzi w sposób niesamodzielny. W czasie udzielania odpowiedzi, nie klikaj poza okno testu.
        O wyniku egzaminu zostaniesz powiadomiony osobnym mailem, po zatwierdzeniu wyników przez Komisję Egzaminacyjną, najczęściej w następnym dniu roboczym.</p>
        <p>Powodzenia na egzaminie!</p>
      next_test: "Przejdź do następnego testu."
      all_done: "Udzieliłeś odpowiedzi na pytania we wszystkich testach. O wyniku egzaminu zostaniesz poinformowany osobnym mailem, po zatwierdzeniu wyników przez Komisję Egzaminacyjną (najczęściej w następnym dniu roboczym)."
      frame_title: "Test egzaminacyjny" # nowe
