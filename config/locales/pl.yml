    status_id_6_name: "Zgłoszenie zamknięte - Wynik egzaminu: Negatywny bez prawa do poprawki"
    status_id_7_name: "Zgłoszenie zamknięte - Wynik egzaminu: Negatywny z prawem do poprawki"
    status_id_8_name: "Zgłoszenie zamknięte - Wynik egzaminu: Nieobecny"
    status_id_9_name: "Zgłoszenie zamknięte - Wynik egzaminu: Pozytywny"
    status_id_10_name: "Zgłoszenie zamknięte - Z powodu wniosku o zmianę terminu egzaminu"
    status_comments:
      1: "Status \"Zgłoszenie utworzone\" oznacza, że Twoje zgłoszenie oczekuje na weryfikację. Dopiero po analizie merytorycznej otrzyma ono status \"Zgłoszenie zaakceptowane\" (lub \"Zgłoszenie odrzucone\"), o czym zostaniesz poinformowany wiadomością wysłaną na Twój e-mail. Tylko zgłoszenia o statusie <strong>\"Zgłoszenie zaakceptowane\"</strong> upoważniają do udziału w egzaminie.<br>...Sprawdzaj status zgłoszenia i czekaj na wiadomość!"
      2: "Status \"Zgłoszenie zaakceptowane\" oznacza, że Twoje zgłoszenie przeszło pozytywnie weryfikację i zostałeś zapisany na egzamin."
      3: "Status \"Zgłoszenie odrzucone\" oznacza, że Twoje zgłoszenie zostało zweryfikowane negatywnie.<br>...Spróbuj raz jeszcze i ponownie utwórz zgłoszenie!"
      4: "Status \"Zgłoszenie zamknięte\" oznacza, że Twoje zgłoszenie nie jest już procedowane.<br>...Utwórz nowe jeżeli chciałbyś wziąć udział w egzaminie!"
      5: "Status \"Zgłoszenie anulowane\" oznacza, że Twoje zgłoszenie nie jest już procedowane.<br>...Utwórz nowe jeżeli chciałbyś wziąć udział w egzaminie!"
      6: "Status \"Zgłoszenie zamknięte - Wynik egzaminu: Negatywny bez prawa do poprawki\".<br>...Utwórz nowe jeżeli chciałbyś wziąć udział w egzaminie!"
      7: "Status \"Zgłoszenie zamknięte - Wynik egzaminu: Negatywny z prawem do poprawki\".<br>...Utwórz nowe jeżeli chciałbyś wziąć udział w egzaminie!"
      8: "Status \"Zgłoszenie zamknięte - Wynik egzaminu: Nieobecny\".<br>...Utwórz nowe jeżeli chciałbyś wziąć udział w egzaminie!"
      9: "Status \"Zgłoszenie zamknięte - Wynik egzaminu: Pozytywny\".<br>...Czekaj na dokument potwierdzający Twoje uprawnienia.!"
      10: "Status \"Zgłoszenie zamknięte - Z powodu wniosku o zmianę terminu egzaminu\".<br>...Utwórz nowe jeżeli chciałbyś wziąć udział w egzaminie!"
